<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste da cena · Pinball Gigante</title>
<style>
  @font-face { font-family: "Lilita One"; src: url("fontes/LilitaOne-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "Figtree"; src: url("fontes/Figtree.ttf") format("truetype"); font-weight: 300 900; font-display: block; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #palco { position: absolute; left: 0; top: 0; width: 1080px; transform-origin: 0 0; overflow: hidden; }
  #mesa { display: block; width: 100%; height: 100%; }
  #erros { position: fixed; left: 0; right: 0; bottom: 0; font: 14px monospace; color: #fff; background: #b00; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="palco"><canvas id="mesa"></canvas></div>
<pre id="erros"></pre>
<script>
  /* Só a mesa, sem HUD nem live: ?momento=jogo|multibola|fogo|ima|mesa|jackpot|caiu|ocioso&t=segundos&leve=1.
     A rodada roda de verdade (regras.js) com semente fixa, pra repetir a mesma foto. */
  const erros = document.getElementById("erros");
  addEventListener("error", e => { erros.textContent += `${e.message} (${e.filename}:${e.lineno})\n`; });
  let semente = Number(new URLSearchParams(location.search).get("semente") || 7);
  Math.random = () => ((semente = (semente * 16807) % 2147483647) - 1) / 2147483646;
</script>
<script src="preset.js"></script>
<script src="regras.js"></script>
<script src="hud.js"></script>
<script src="mesa.js"></script>
<script>
(async () => {
  try { await Promise.all([document.fonts.load('40px "Lilita One"'), document.fonts.load('800 27px "Figtree"')]); }
  catch (e) { /* segue com a fonte reserva */ }
  const url = new URLSearchParams(location.search);
  const momento = url.get("momento") || "jogo";
  const t = Number(url.get("t") ?? NaN);
  const config = JSON.parse(JSON.stringify(PINBALL_PRESETS[PINBALL_PRESET_PADRAO]));

  const W = 1080, H = Math.min(2520, Math.max(1920, Math.round(W * innerHeight / innerWidth)));
  const escala = Math.min(innerWidth / W, innerHeight / H);
  const palco = document.getElementById("palco");
  palco.style.height = `${H}px`;
  palco.style.transform = `scale(${escala})`;

  const p = new Pinball(config, Math.random);
  Mesa.montar(document.getElementById("mesa"), config, p, url.get("leve") === "1");
  Mesa.aplicarFormato(W, H, escala);

  const vistos = [];
  const repassar = lista => {
    for (const a of lista) vistos.push(a.tipo);
    if (lista.length) Mesa.ver(lista);
    if (lista.some(a => a.tipo === "ocioso")) Mesa.ocioso(true);
    if (lista.some(a => a.tipo === "lancou" || a.tipo === "retomou")) Mesa.ocioso(false);
  };
  const passo = 1 / 60;
  let relogio = 0;
  const andar = (s, ate = null) => {
    for (let i = 0; i < Math.round(s / passo); i++) {
      const lista = p.passo(passo);
      repassar(lista);
      relogio += passo;
      Mesa.quadro(passo, relogio);
      if (ate && lista.some(ate)) return true;
    }
    return false;
  };

  const gente = ["gabizinha", "joaozin", "mari_10", "zeca", "dudinha", "lucas.fla", "bia", "rafa_vp"];
  const doador = { id: "gabizinha", nome: "gabizinha" };
  const presente = faixa => repassar(p.presente(doador, { nome: "Rose", moedas: 1, faixa }));
  if (momento !== "ocioso") {
    gente.forEach((n, i) => { repassar(p.comentario({ id: n, nome: n }, "bora")); andar(0.4 + i * 0.05); });
    andar(4);
  }
  const padrao = { jogo: 3, multibola: 1.2, fogo: 1.5, ima: 1.5, mesa: 1.5, jackpot: 0.8, caiu: 0.3, ocioso: 2 };
  if (momento === "multibola") presente(2);
  else if (momento === "fogo") presente(3);
  else if (momento === "ima") presente(1);
  else if (momento === "mesa") presente(4);
  else if (momento === "jackpot") repassar((() => { const l = []; p.encher(p.pessoa(doador), p.jackpot.meta - p.jackpot.valor, l); return l; })());
  else if (momento === "caiu") andar(60, a => a.tipo === "caiu");
  andar(Number.isFinite(t) ? t : padrao[momento] ?? 1);

  document.title = `fase=${p.fase} bolas=${p.bolas.length} eventos=${[...new Set(vistos)].join(",")}`;
  document.body.dataset.pronto = "1";
})().catch(e => { document.getElementById("erros").textContent += e.stack + "\n"; document.title = "ERRO " + e.message; });
</script>
</body>
</html>
